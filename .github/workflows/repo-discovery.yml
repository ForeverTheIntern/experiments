name: repo-discovery

on:
  push:
    branches: [main]
    paths:
      - "repo-discovery/**"
      - ".github/workflows/repo-discovery.yml"
  pull_request:
    paths:
      - "repo-discovery/**"
      - ".github/workflows/repo-discovery.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: repo-discovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: repo-discovery/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Ubuntu 24.04 keeps unprivileged user namespaces from mounting; the sandbox tests need it.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pytest
        env:
          REQUIRE_NAMESPACES: "1"
